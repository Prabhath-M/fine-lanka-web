name: Build and deploy to cPanel

# Builds the site here (GitHub's runners, not the shared hosting
# account) because the cPanel account hits a hard memory ceiling
# during `pnpm install`/`next build` - see the deploy log from
# 2026-09-03 (`Fatal process out of memory: Failed to reserve
# virtual memory for CodeRange`), which is a CloudLinux LVE limit,
# invisible to `ulimit`, that shared hosting plans impose and that
# can't be tuned around with Node flags.
#
# The finished build output gets force-pushed to the `deploy/production`
# branch (just the built files + a lightweight .cpanel.yml, no source,
# no git history kept - it's regenerated fresh every run). cPanel's own
# Git Version Control then tracks THAT branch separately from `main`,
# and its deploy step is just a copy + restart - no build, no install,
# nothing that can hit the memory ceiling.
#
# GitHub's runners are linux-x64/glibc, matching this cPanel host's
# architecture, so native deps (sharp) built here are compatible -
# no cross-architecture mismatch to worry about.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push-deploy-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://finelankatours.com
        run: pnpm run build:cpanel

      - name: Assemble deploy branch content
        run: |
          rm -rf /tmp/deploy-branch
          mkdir -p /tmp/deploy-branch
          cp -R deploy/server.js /tmp/deploy-branch/
          cp -R deploy/node_modules /tmp/deploy-branch/
          cp -R deploy/package.json /tmp/deploy-branch/
          cp -R deploy/.next /tmp/deploy-branch/
          cp -R deploy/public /tmp/deploy-branch/
          cat > /tmp/deploy-branch/.cpanel.yml <<'EOF'
          ---
          # Auto-generated by .github/workflows/deploy.yml - do not edit by
          # hand, changes here get overwritten on the next push to main.
          #
          # No build step here on purpose - this branch already contains
          # the finished build from GitHub Actions. This just copies it
          # into the live app folder and restarts.
          deployment:
            tasks:
              - export DEPLOYPATH=/home/finelbts/finelankatours-app
              - /bin/cp -R ./server.js $DEPLOYPATH/
              - /bin/rm -rf $DEPLOYPATH/node_modules
              - /bin/cp -R ./node_modules $DEPLOYPATH/
              - /bin/cp -R ./package.json $DEPLOYPATH/
              - /bin/rm -rf $DEPLOYPATH/.next
              - /bin/cp -R ./.next $DEPLOYPATH/
              - /bin/cp -R ./public $DEPLOYPATH/
              - /bin/mkdir -p $DEPLOYPATH/tmp
              - /bin/touch $DEPLOYPATH/tmp/restart.txt
          EOF

      - name: Push to deploy/production branch
        run: |
          cd /tmp/deploy-branch
          git init -q
          git checkout -q -b deploy/production
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -q -m "Deploy build of ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin deploy/production
