---
# cPanel Git Version Control deployment config.
#
# When you click "Deploy HEAD Commit" in cPanel (Software > Git Version
# Control) after pulling the latest commit, these tasks run in order,
# from the repository's clone directory on the server.
#
# What this does:
#   1. Installs pnpm (this project's package manager - see
#      pnpm-workspace.yaml / pnpm-lock.yaml) into the Node.js
#      environment cPanel set up for this app, then installs
#      dependencies from the committed lockfile.
#   2. Runs the same build:cpanel script used for manual deploys
#      (next build + scripts/prepare-cpanel-deploy.mjs), producing a
#      ready deploy/ folder.
#   3. Copies deploy/'s contents into the live app folder.
#   4. Touches tmp/restart.txt, which is how Passenger (the process
#      manager cPanel's Node.js App uses) knows to reload the app.
#
# Because the build runs ON the same server the app runs on, there's
# no cross-architecture mismatch to worry about for native deps like
# sharp - unlike a build done on a different machine and then uploaded.
#
# NOTE: paths below are specific to this hosting account
# (finelbts / finelankatours-app). If the app's cPanel username,
# app root, or Node.js version ever changes, these paths need updating
# to match - check Setup Node.js App in cPanel for the current values.
#
# NEXT_PUBLIC_SITE_URL is written to .env.production.local before the
# build because it's baked into statically generated output (robots.txt,
# sitemap.xml, page metadata) at build time - cPanel's own Node.js App
# environment variables (set in Setup Node.js App) are only injected
# into the running app at runtime, not into this deployment shell, so
# without this the build would silently fall back to localhost. This
# value isn't sensitive (it's a public URL, hence the NEXT_PUBLIC_
# prefix), so it's fine to keep here in plain text. The actual secrets
# (RESEND_API_KEY etc.) are only read at runtime by the API routes, so
# they stay solely in cPanel's Node.js App environment variables screen
# and never need to appear in this file or in git.

deployment:
  tasks:
    - export DEPLOYPATH=/home/finelbts/finelankatours-app
    - export NODEENV=/home/finelbts/nodevenv/finelankatours-app/10/bin/activate
    - echo "NEXT_PUBLIC_SITE_URL=https://finelankatours.com" > .env.production.local
    - source $NODEENV && npm install -g pnpm
    - source $NODEENV && pnpm install --frozen-lockfile
    - source $NODEENV && pnpm run build:cpanel
    - /bin/cp -R ./deploy/. $DEPLOYPATH/
    - /bin/mkdir -p $DEPLOYPATH/tmp
    - /bin/touch $DEPLOYPATH/tmp/restart.txt
