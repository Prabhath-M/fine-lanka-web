---
# Auto-generated by .github/workflows/deploy.yml - do not edit by
# hand, changes here get overwritten on the next push to main.
#
# No build step here on purpose - this branch already contains
# the finished build from GitHub Actions. This just copies it
# into the live app folder and restarts.
deployment:
  tasks:
    - export DEPLOYPATH=/home/finelbts/finelankatours-app
    - /bin/cp -R ./server.js $DEPLOYPATH/
    - /bin/rm -rf $DEPLOYPATH/node_modules
    - /bin/cp -R ./node_modules $DEPLOYPATH/
    - /bin/cp -R ./package.json $DEPLOYPATH/
    - /bin/rm -rf $DEPLOYPATH/.next
    - /bin/cp -R ./.next $DEPLOYPATH/
    - /bin/cp -R ./public $DEPLOYPATH/
    - /bin/mkdir -p $DEPLOYPATH/tmp
    - /bin/touch $DEPLOYPATH/tmp/restart.txt
